<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>輪胎英雄：魔王降臨</title>
    <style>
        :root { height: -webkit-fill-available; }
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; touch-action: none; user-select: none; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; }
        #ui { 
            position: absolute; top: 0; left: 0; width: 100%; 
            display: flex; justify-content: space-around; align-items: center; 
            padding: 10px 0; background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px); color: #000; font-weight: 900; 
            font-size: 16px; text-shadow: 1px 1px 0 #fff; z-index: 100; pointer-events: none; 
        }
        #boss-ui { 
            position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
            width: 200px; height: 20px; background: #333; border: 2px solid #fff;
            display: none; z-index: 110;
        }
        #boss-hp { width: 100%; height: 100%; background: #ff0000; transition: width 0.2s; }
        #power-ui { position: absolute; top: 50px; right: 20px; color: #ff0000; font-weight: 900; font-size: 24px; text-shadow: 1px 1px 5px #fff; z-index: 100; display: none; }
        #controls { position: absolute; bottom: 25px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 35px; box-sizing: border-box; z-index: 150; align-items: flex-end; }
        .side-right { display: flex; gap: 20px; align-items: flex-end; }
        .action-btn { width: 50px; height: 50px; background: rgba(0,0,0,0.7); border: 2px solid #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; color: #fff; backdrop-filter: blur(5px); -webkit-tap-highlight-color: transparent; }
        #leftBtn { width: 90px; height: 90px; font-size: 40px; }
        #fireBtn.active { background: rgba(211, 47, 47, 0.9); box-shadow: 0 0 15px #ff0000; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 200; }
        .btn { padding: 18px 45px; background: #FFD600; border-radius: 50px; font-weight: bold; font-size: 24px; border: none; box-shadow: 0 6px 0 #A68B00; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat-item">LV: <span id="levelText">1</span></div>
    <div class="stat-item">LIFE: <span id="livesText">👤👤👤</span></div>
    <div class="stat-item">HP: <span id="hpText" style="color: #e91e63;">❤️❤️❤️❤️❤️</span></div>
    <div class="stat-item">SCORE: <span id="score">0</span> / 2000</div>
</div>

<div id="boss-ui"><div id="boss-hp"></div></div>
<div id="power-ui"><span id="timer">20</span>s 🔥</div>

<div id="controls">
    <div class="side-left"><div class="action-btn" id="leftBtn">▶</div></div>
    <div class="side-right">
        <div class="action-btn" id="fireBtn">🔥</div> 
        <div class="action-btn" id="jumpBtn">▲</div> 
    </div>
</div>

<div id="overlay">
    <div style="background:#fff; padding:30px; border-radius:20px; text-align:center;">
        <h2 id="endStatus" style="display:none;">GAME OVER</h2>
        <button class="btn" id="startBtn">START</button>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score'), hpEl = document.getElementById('hpText'), livesEl = document.getElementById('livesText'), levelEl = document.getElementById('levelText'), powerUi = document.getElementById('power-ui'), timerEl = document.getElementById('timer'), bossUi = document.getElementById('boss-ui'), bossHpBar = document.getElementById('boss-hp'), overlay = document.getElementById('overlay'), startBtn = document.getElementById('startBtn'), fireBtn = document.getElementById('fireBtn');

let gameState = 'START', score = 0, hp = 5, lives = 3, level = 1, speedOffset = 0, invincibleFrame = 0, currentSpeed = 0;
const ROAD_Y_RATIO = 0.85;

let player = { x: 150, y: 0, vy: 0, jumped: false, powerTime: 0 };
let obstacles = [], coins = [], bullets = [], bgX = 0, distanceCounter = 0, isPressingGo = false;

// Boss 系統
let boss = { active: false, x: 0, y: 0, hp: 100, maxHp: 100, shootTimer: 0 };

let audioCtx = null, musicTimer = null, melodyStep = 0;
const MELODIES = [[262, 330, 392, 523], [293, 349, 440, 587], [220, 220, 200, 200]]; // 最後一個是 Boss 音樂

function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(f, d, v, t='sine') {
    if(!audioCtx) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
    g.gain.setValueAtTime(v, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
    o.connect(g).connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + d);
}

function loopBGM() {
    if (gameState !== 'PLAYING') return;
    let mIdx = boss.active ? 2 : (level - 1) % 2;
    let freq = MELODIES[mIdx][melodyStep % MELODIES[mIdx].length];
    playSound(freq, 0.2, 0.05, boss.active ? 'sawtooth' : 'triangle');
    melodyStep++;
    musicTimer = setTimeout(loopBGM, boss.active ? 200 : 300);
}

startBtn.onclick = () => {
    initAudio(); score = 0; hp = 5; lives = 3; level = 1; speedOffset = 0;
    boss.active = false; bossUi.style.display = 'none';
    obstacles = []; coins = []; bullets = []; gameState = 'PLAYING';
    overlay.style.display = 'none'; updateUI(); loopBGM();
};

function updateUI() {
    hpEl.innerText = "❤️".repeat(hp);
    livesEl.innerText = "👤".repeat(lives);
    levelEl.innerText = level;
    scoreEl.innerText = score;
}

window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
canvas.width = window.innerWidth; canvas.height = window.innerHeight;

function update() {
    if (gameState !== 'PLAYING') return;
    
    currentSpeed = isPressingGo ? Math.min(6.5 + speedOffset, currentSpeed + 0.15) : Math.max(0, currentSpeed - 0.05);
    bgX = (bgX - currentSpeed) % canvas.width;
    
    player.vy += 0.55; player.y += player.vy;
    let groundY = canvas.height * ROAD_Y_RATIO - 50;
    if (player.y > groundY) { player.y = groundY; player.vy = 0; player.jumped = false; }
    
    if (player.powerTime > 0) {
        player.powerTime -= 0.016;
        powerUi.style.display = 'block'; timerEl.innerText = Math.ceil(player.powerTime);
        fireBtn.classList.add('active');
        if (player.powerTime <= 0) { powerUi.style.display = 'none'; fireBtn.classList.remove('active'); }
    }
    if (invincibleFrame > 0) invincibleFrame--;

    // 觸發 Boss 戰
    if (!boss.active && score >= 2000) {
        boss.active = true; boss.hp = 100 + level * 50; boss.maxHp = boss.hp;
        boss.x = canvas.width + 100; boss.y = groundY - 50;
        bossUi.style.display = 'block';
        playSound(150, 0.5, 0.2, 'sawtooth');
    }

    if (boss.active) {
        // Boss 進入畫面並浮動
        boss.x = Math.max(canvas.width - 150, boss.x - 2);
        boss.y = (canvas.height * ROAD_Y_RATIO - 100) + Math.sin(Date.now() / 300) * 30;
        
        // Boss 攻擊
        boss.shootTimer++;
        if (boss.shootTimer > 80 - level * 5) {
            obstacles.push({ x: boss.x, y: boss.y + 20, type: 'banana', speed: 8 + speedOffset });
            boss.shootTimer = 0;
            playSound(300, 0.2, 0.1, 'sine');
        }
        bossHpBar.style.width = (boss.hp / boss.maxHp * 100) + '%';
    } else {
        distanceCounter += currentSpeed;
        if (distanceCounter > 400) {
            for(let i=0; i<3; i++) coins.push({ x: canvas.width + 100 + i*45, y: groundY - 100, type: 'gold' });
            if(Math.random() < 0.2) coins.push({ x: canvas.width + 150, y: groundY - 150, type: Math.random() < 0.3 ? 'heart' : 'red' });
            obstacles.push({ x: canvas.width + 300, y: groundY + 10, type: 'car', speed: currentSpeed + 2 });
            distanceCounter = 0;
        }
    }

    // 子彈碰撞 Boss
    bullets.forEach((b, bi) => {
        b.x += 12;
        if (boss.active && Math.abs(b.x - boss.x) < 60 && Math.abs(b.y - boss.y) < 80) {
            boss.hp -= 10; bullets.splice(bi, 1);
            playSound(400, 0.1, 0.1, 'square');
            if (boss.hp <= 0) {
                boss.active = false; bossUi.style.display = 'none';
                score = 0; level++; lives++; speedOffset += 0.3;
                updateUI(); playSound(1200, 0.5, 0.2);
            }
        }
    });

    // 碰撞偵測
    obstacles.forEach((o, i) => {
        o.x -= (boss.active ? o.speed : currentSpeed + 2);
        if (invincibleFrame === 0 && Math.abs(player.x - o.x) < 40 && Math.abs(player.y - o.y) < 40) {
            hp--; invincibleFrame = 90; playSound(100, 0.3, 0.1, 'sawtooth');
            if (hp <= 0) { lives--; hp = 5; if (lives <= 0) { gameState = 'OVER'; overlay.style.display = 'flex'; } }
            updateUI();
        }
    });

    coins.forEach((c, i) => {
        c.x -= currentSpeed;
        if (Math.abs(player.x - c.x) < 40 && Math.abs(player.y - c.y) < 40) {
            if (c.type === 'heart') hp = 5;
            else if (c.type === 'red') player.powerTime = 15;
            else score += 10;
            coins.splice(i, 1); updateUI(); playSound(1000, 0.1, 0.05);
        }
    });

    obstacles = obstacles.filter(o => o.x > -100);
    coins = coins.filter(c => c.x > -100);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // 繪製背景山脈
    ctx.fillStyle = '#2E7D32';
    for(let i=0; i<2; i++) {
        let x = (bgX * 0.4) % canvas.width + i * canvas.width;
        ctx.beginPath(); ctx.moveTo(x, canvas.height * ROAD_Y_RATIO); ctx.lineTo(x + canvas.width/2, 200); ctx.lineTo(x + canvas.width, canvas.height * ROAD_Y_RATIO); ctx.fill();
    }

    ctx.fillStyle = '#444'; ctx.fillRect(0, canvas.height * ROAD_Y_RATIO, canvas.width, canvas.height);
    
    if (invincibleFrame % 10 < 5) {
        ctx.font = '50px Arial'; ctx.save();
        ctx.translate(player.x + 25, player.y + 25);
        if (player.powerTime > 0) { ctx.strokeStyle = 'red'; ctx.lineWidth = 3; ctx.strokeRect(-25, -25, 50, 50); }
        ctx.scale(-1, 1); ctx.fillText('🚴', 0, 0); ctx.restore();
    }
    
    if (boss.active) {
        ctx.font = '80px Arial'; ctx.fillText('🐒', boss.x - 40, boss.y + 40);
        ctx.font = '20px Arial'; ctx.fillStyle = "black"; ctx.fillText("BOSS", boss.x - 30, boss.y - 20);
    }

    bullets.forEach(b => { ctx.font = '30px Arial'; ctx.fillText('🔥', b.x, b.y); });
    obstacles.forEach(o => { ctx.font = '40px Arial'; ctx.fillText(o.type === 'banana' ? '🍌' : '🚗', o.x, o.y + 30); });
    coins.forEach(c => { ctx.font = '30px Arial'; ctx.fillText(c.type === 'heart' ? '💖' : (c.type === 'red' ? '🔴' : '🪙'), c.x, c.y); });

    update(); requestAnimationFrame(draw);
}

document.getElementById('leftBtn').ontouchstart = (e) => { e.preventDefault(); isPressingGo = true; initAudio(); };
document.getElementById('leftBtn').ontouchend = () => isPressingGo = false;
document.getElementById('jumpBtn').ontouchstart = (e) => { 
    e.preventDefault(); if (!player.jumped && gameState === 'PLAYING') { player.vy = -14.5; player.jumped = true; playSound(880, 0.1, 0.05); }
};
document.getElementById('fireBtn').ontouchstart = (e) => { 
    e.preventDefault(); if (player.powerTime > 0 && gameState === 'PLAYING') { bullets.push({ x: player.x + 50, y: player.y + 20 }); playSound(600, 0.1, 0.05, 'square'); }
};

draw();
</script>
</body>
</html>
